name: Update J2 player extra stats

on:
  schedule:
    - cron: "15 21 * * *" # 日本時間 毎朝6時15分
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-player-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch J2 player extra stats
        run: python scripts/fetch_j2_player_extra_stats.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/j2-player-extra-stats.json
          git diff --cached --quiet || git commit -m "chore: update J2 player extra stats [skip ci]"
          git push
