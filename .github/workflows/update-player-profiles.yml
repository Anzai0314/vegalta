name: Update player profiles

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch player profiles
        run: python scripts/fetch_player_profiles.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/player-profiles.json
          git diff --cached --quiet || git commit -m "chore: update player profiles"
          git push
