name: Update J.League standings

on:
  schedule:
    # 毎時実行。試合が多い日本時間14:00〜翌0:30は30分おきに追加実行する。
    - cron: "0 * * * *"
    - cron: "30 5-15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch standings
        run: python scripts/fetch_standings.py

      - name: Recalculate season forecast
        run: python scripts/build_season_forecast.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standings.json data/season-forecast.json
          git diff --cached --quiet || git commit -m "chore: update J.League standings [skip ci]"
          git push
