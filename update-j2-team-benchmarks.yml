name: Update J2 team benchmarks

on:
  schedule:
    - cron: "0 21 * * *" # 日本時間 毎朝6時
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch J2 team benchmarks
        run: python scripts/fetch_j2_team_benchmarks.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/j2-team-benchmarks.json
          git diff --cached --quiet || git commit -m "chore: update J2 team benchmarks [skip ci]"
          git push
